[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skfdiff"
version = "0.1.0"
description = "Structured kernel-field prediction and fixed-operator diffusion reconstruction"
requires-python = ">=3.8"
dependencies = ["torch>=2.0", "numpy>=1.24", "Pillow>=9"]

[tool.setuptools.packages.find]
include = ["skfdiff*"]
